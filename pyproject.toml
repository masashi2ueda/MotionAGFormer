[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "motionagformer-kendo"
version = "0.1.0"
description = "MotionAGFormer fork for kendo pose estimation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["motionagformer*"]